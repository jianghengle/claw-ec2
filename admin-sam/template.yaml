AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  admin-sam

  Sample SAM Template for admin-sam

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "ClawUsers"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        -
          AttributeName: "id"
          AttributeType: "S"
        -
          AttributeName: "email"
          AttributeType: "S"
        -
          AttributeName: "token"
          AttributeType: "S"
      KeySchema:
        -
          AttributeName: "id"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        -
          IndexName: "emailGSI"
          KeySchema:
            -
              AttributeName: "email"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"
        -
          IndexName: "tokenGSI"
          KeySchema:
            -
              AttributeName: "token"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "ClawSubscriptions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        -
          AttributeName: "id"
          AttributeType: "S"
        -
          AttributeName: "userId"
          AttributeType: "S"
      KeySchema:
        -
          AttributeName: "id"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        -
          IndexName: "userIdGSI"
          KeySchema:
            -
              AttributeName: "userId"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "ClawPayments"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        -
          AttributeName: "id"
          AttributeType: "S"
        -
          AttributeName: "subscriptionId"
          AttributeType: "S"
        -
          AttributeName: "checkoutSessionId"
          AttributeType: "S"
      KeySchema:
        -
          AttributeName: "id"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        -
          IndexName: "subscriptionIdGSI"
          KeySchema:
            -
              AttributeName: "subscriptionId"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"
        -
          IndexName: "CheckoutSessionIdGSI"
          KeySchema:
            -
              AttributeName: "checkoutSessionId"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"

  InstancesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "ClawInstances"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        -
          AttributeName: "id"
          AttributeType: "S"
      KeySchema:
        -
          AttributeName: "id"
          KeyType: "HASH"

  MyAppFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            Service: [lambda.amazonaws.com]
        Version: '2012-10-17'
      Policies:
      - PolicyDocument: 
          Statement:
          - Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Effect: Allow
            Resource: "*"
          - Action: [
              "dynamodb:GetItem",
              "dynamodb:PutItem",
              "dynamodb:Query",
              "dynamodb:Scan",
              "dynamodb:UpdateItem",
              "dynamodb:BatchExecuteStatement",
              "dynamodb:BatchWriteItem"
            ]
            Effect: Allow
            Resource:
              - !GetAtt UsersTable.Arn
              - !Join [ '/',[!GetAtt UsersTable.Arn, index/*]]
              - !GetAtt SubscriptionsTable.Arn
              - !Join [ '/',[!GetAtt SubscriptionsTable.Arn, index/*]]
              - !GetAtt PaymentsTable.Arn
              - !Join [ '/',[!GetAtt PaymentsTable.Arn, index/*]]
              - !GetAtt InstancesTable.Arn
              - !Join [ '/',[!GetAtt InstancesTable.Arn, index/*]]
          - Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Effect: Allow
            Resource: "*"
          - Action:
              - states:StartExecution
            Effect: Allow
            Resource: !GetAtt Ec2ProvisioningStateMachine.Arn
          Version: '2012-10-17'
        PolicyName: 'MyAppFunctionRolePolicy'

  MyAppFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler.handle
      Runtime: python3.14
      Architectures:
        - arm64
      Events:
        getProxy:
          Type: Api
          Properties:
            Path: '/{proxy+}'
            Method: get
        postProxy:
          Type: Api
          Properties:
            Path: '/{proxy+}'
            Method: post
        optionsProxy:
          Type: Api
          Properties:
            Path: '/{proxy+}'
            Method: options
      Role:
        !GetAtt MyAppFunctionRole.Arn
      Environment:
        Variables:
          STRIPE_KEY: ''
          STRIPE_PRICE_KEY: ''
          STRIPE_WEBHOOK: ''
          APP_DOMAIN: ''

  Ec2CreationFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            Service: [lambda.amazonaws.com]
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Effect: Allow
            Resource: "*"
          - Action:
              - ec2:RunInstances
              - ec2:CreateTags
              - ec2:CreateSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:ModifyInstanceAttribute
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
              - ec2:DescribeSecurityGroups
              - ec2:DescribeImages
              - ec2:DescribeKeyPairs
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
            Effect: Allow
            Resource: "*"
          - Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            Effect: Allow
            Resource:
              - !GetAtt InstancesTable.Arn
              - !Join [ '/',[!GetAtt InstancesTable.Arn, index/*]]
          - Action:
              - elasticloadbalancing:CreateTargetGroup
              - elasticloadbalancing:RegisterTargets
              - elasticloadbalancing:DeregisterTargets
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeListeners
            Effect: Allow
            Resource: "*"
          - Action:
              - acm:ListCertificates
              - acm:DescribeCertificate
            Effect: Allow
            Resource: "*"
          Version: '2012-10-17'
        PolicyName: 'Ec2CreationFunctionRolePolicy'

  Ec2CreationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.ec2_handler.handle_creation
      Runtime: python3.14
      Architectures:
        - arm64
      Timeout: 60
      Role:
        !GetAtt Ec2CreationFunctionRole.Arn

  Ec2CheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.ec2_handler.handle_check
      Runtime: python3.14
      Architectures:
        - arm64
      Timeout: 60
      Role:
        !GetAtt Ec2CreationFunctionRole.Arn

  Ec2SetupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.ec2_handler.handle_setup
      Runtime: python3.14
      Architectures:
        - arm64
      Timeout: 60
      Role:
        !GetAtt Ec2CreationFunctionRole.Arn

  Ec2ProvisioningStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            Service: [states.amazonaws.com]
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
              - lambda:InvokeFunction
            Effect: Allow
            Resource:
              - !GetAtt Ec2CreationFunction.Arn
              - !GetAtt Ec2CheckFunction.Arn
              - !GetAtt Ec2SetupFunction.Arn
          Version: '2012-10-17'
        PolicyName: 'Ec2ProvisioningStateMachinePolicy'

  Ec2ProvisioningStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: Ec2ProvisioningStateMachine
      Role: !GetAtt Ec2ProvisioningStateMachineRole.Arn
      Definition:
        Comment: "Provision an EC2 instance: create, wait for ready, then setup"
        StartAt: CreateInstance
        TimeoutSeconds: 900
        States:
          CreateInstance:
            Type: Task
            Resource: !GetAtt Ec2CreationFunction.Arn
            InputPath: "$"
            ResultPath: "$.createResult"
            Next: InitRetryCount
          InitRetryCount:
            Type: Pass
            Result:
              count: 0
            ResultPath: "$.retryCount"
            Next: WaitForReady
          WaitForReady:
            Type: Wait
            Seconds: 30
            Next: CheckInstance
          CheckInstance:
            Type: Task
            Resource: !GetAtt Ec2CheckFunction.Arn
            InputPath: "$"
            ResultPath: "$.checkResult"
            Next: IsReady
          IsReady:
            Type: Choice
            Choices:
              - Variable: "$.checkResult.result"
                BooleanEquals: true
                Next: SetupInstance
            Default: IncrementRetry
          IncrementRetry:
            Type: Pass
            ResultPath: "$.retryCount"
            Parameters:
              "count.$": "States.MathAdd($.retryCount.count, 1)"
            Next: CheckRetryLimit
          CheckRetryLimit:
            Type: Choice
            Choices:
              - Variable: "$.retryCount.count"
                NumericGreaterThanEquals: 20
                Next: TimeoutFail
            Default: WaitForReady
          TimeoutFail:
            Type: Fail
            Cause: "EC2 instance did not pass status checks within 10 minutes"
            Error: "CheckTimeout"
          SetupInstance:
            Type: Task
            Resource: !GetAtt Ec2SetupFunction.Arn
            InputPath: "$"
            End: true

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  MyAppApi:
    Description: "API Gateway endpoint URL for Prod stage for MyApp function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/ping/"
  MyAppFunction:
    Description: "MpApp Lambda Function ARN"
    Value: !GetAtt MyAppFunction.Arn
  MyAppFunctionIamRole:
    Description: "Implicit IAM Role created for MyApp function"
    Value: !GetAtt MyAppFunctionRole.Arn
