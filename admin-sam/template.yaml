AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  admin-sam

  Sample SAM Template for admin-sam

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "ClawUsers"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        -
          AttributeName: "id"
          AttributeType: "S"
        -
          AttributeName: "email"
          AttributeType: "S"
        -
          AttributeName: "token"
          AttributeType: "S"
      KeySchema:
        -
          AttributeName: "id"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        -
          IndexName: "emailGSI"
          KeySchema:
            -
              AttributeName: "email"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"
        -
          IndexName: "tokenGSI"
          KeySchema:
            -
              AttributeName: "token"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "ClawSubscriptions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        -
          AttributeName: "id"
          AttributeType: "S"
        -
          AttributeName: "userId"
          AttributeType: "S"
      KeySchema:
        -
          AttributeName: "id"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        -
          IndexName: "userIdGSI"
          KeySchema:
            -
              AttributeName: "userId"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "ClawPayments"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        -
          AttributeName: "id"
          AttributeType: "S"
        -
          AttributeName: "subscriptionId"
          AttributeType: "S"
        -
          AttributeName: "checkoutSessionId"
          AttributeType: "S"
      KeySchema:
        -
          AttributeName: "id"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        -
          IndexName: "subscriptionIdGSI"
          KeySchema:
            -
              AttributeName: "subscriptionId"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"
        -
          IndexName: "CheckoutSessionIdGSI"
          KeySchema:
            -
              AttributeName: "checkoutSessionId"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"

  InstancesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "ClawInstances"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        -
          AttributeName: "id"
          AttributeType: "S"
      KeySchema:
        -
          AttributeName: "id"
          KeyType: "HASH"

  MyAppFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            Service: [lambda.amazonaws.com]
        Version: '2012-10-17'
      Policies:
      - PolicyDocument: 
          Statement:
          - Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Effect: Allow
            Resource: "*"
          - Action: [
              "dynamodb:GetItem",
              "dynamodb:PutItem",
              "dynamodb:Query",
              "dynamodb:Scan",
              "dynamodb:UpdateItem",
              "dynamodb:BatchExecuteStatement",
              "dynamodb:BatchWriteItem"
            ]
            Effect: Allow
            Resource:
              - !GetAtt UsersTable.Arn
              - !Join [ '/',[!GetAtt UsersTable.Arn, index/*]]
              - !GetAtt SubscriptionsTable.Arn
              - !Join [ '/',[!GetAtt SubscriptionsTable.Arn, index/*]]
              - !GetAtt PaymentsTable.Arn
              - !Join [ '/',[!GetAtt PaymentsTable.Arn, index/*]]
              - !GetAtt InstancesTable.Arn
              - !Join [ '/',[!GetAtt InstancesTable.Arn, index/*]]
          - Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Effect: Allow
            Resource: "*"
          Version: '2012-10-17'
        PolicyName: 'MyAppFunctionRolePolicy'

  MyAppFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler.handle
      Runtime: python3.14
      Architectures:
        - arm64
      Events:
        getProxy:
          Type: Api
          Properties:
            Path: '/{proxy+}'
            Method: get
        postProxy:
          Type: Api
          Properties:
            Path: '/{proxy+}'
            Method: post
        optionsProxy:
          Type: Api
          Properties:
            Path: '/{proxy+}'
            Method: options
      Role:
        !GetAtt MyAppFunctionRole.Arn
      Environment:
        Variables:
          STRIPE_KEY: ''
          STRIPE_PRICE_KEY: ''
          STRIPE_WEBHOOK: ''
          APP_DOMAIN: ''

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  MyAppApi:
    Description: "API Gateway endpoint URL for Prod stage for MyApp function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/ping/"
  MyAppFunction:
    Description: "MpApp Lambda Function ARN"
    Value: !GetAtt MyAppFunction.Arn
  MyAppFunctionIamRole:
    Description: "Implicit IAM Role created for MyApp function"
    Value: !GetAtt MyAppFunctionRole.Arn
